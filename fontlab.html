<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slogan fonts</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Italianno&family=Parisienne&family=Great+Vibes&family=Mrs+Saint+Delafield&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Allura&family=Pinyon+Script&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#234F2E;color:#EFE6D8;font-family:Jost,sans-serif}
.r{display:grid;grid-template-columns:60px 1fr;align-items:center;padding:16px 40px;border-bottom:1px solid rgba(239,230,216,.2)}
.n{font-size:22px;letter-spacing:.2em;opacity:.7}.s{text-align:center;line-height:1.1}</style></head><body>
<div class="r"><span class="n">0</span><span class="s" style="font-family:'Pinyon Script';font-size:52px">Movement that makes you happy</span></div>
<div class="r"><span class="n">1</span><span class="s" style="font-family:'Instrument Serif';font-style:italic;font-size:54px">Movement that makes you happy</span></div>
<div class="r"><span class="n">2</span><span class="s" style="font-family:'Instrument Serif';text-transform:uppercase;letter-spacing:.18em;font-size:36px">Movement that makes you happy</span></div>
<div class="r"><span class="n">3</span><span class="s" style="font-family:'Cormorant Garamond';font-style:italic;font-weight:300;font-size:56px">Movement that makes you happy</span></div>
<div class="r"><span class="n">4</span><span class="s" style="font-family:'Italianno';font-size:70px">Movement that makes you happy</span></div>
<div class="r"><span class="n">5</span><span class="s" style="font-family:'Parisienne';font-size:52px">Movement that makes you happy</span></div>
<div class="r"><span class="n">6</span><span class="s" style="font-family:'Great Vibes';font-size:60px">Movement that makes you happy</span></div>
<div class="r"><span class="n">7</span><span class="s" style="font-family:'Allura';font-size:62px">Movement that makes you happy</span></div>
<div class="r"><span class="n">8</span><span class="s" style="font-family:'Mrs Saint Delafield';font-size:72px">Movement that makes you happy</span></div>
</body></html>
